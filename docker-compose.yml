version: "3.9"

services:
  cns-pedagogy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cns-pedagogy-app
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
